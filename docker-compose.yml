x-env-defaults: &env-defaults
  LOG_LEVEL: "debug"

services:
  postgres:
    image: postgres:18.1
    environment:
      <<: *env-defaults
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gophkeeper
      PGDATA: /var/lib/postgresql/data
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs
    command: ["mini"]
    environment:
      AWS_ACCESS_KEY_ID: "s3login"
      AWS_SECRET_ACCESS_KEY: "s3pass123"
    ports:
      - "8333:8333"
      - "23646:23646"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -I -X GET localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gophkeeper:
    image: debian:13.2-slim
    platform: linux/amd64
    working_dir: /app
    volumes:
      - ./bin/server:/usr/local/bin/gophkeeper
      - ./contrib/cert/cert.pem:/opt/cert.pem
      - ./contrib/cert/key.pem:/opt/key.pem
    command: ["/usr/local/bin/gophkeeper", "run", "--debug=true"]
    environment:
      <<: *env-defaults
      GK_DEBUG: "true"
      GK_ADDRESS: ":8080"
      GK_DATABASE_URI: "postgres://postgres:postgres@postgres:5432/gophkeeper?sslmode=disable"
      GK_S3_ENDPOINT: "seaweedfs:8333"
      GK_S3_ACCESS_KEY: "s3login"
      GK_S3_SECRET_KEY: "s3pass123"
      GK_TLS_CERT_FILE: "/opt/cert.pem"
      GK_TLS_KEY_FILE: "/opt/key.pem"
      GK_JWT_SECRET: "HANePj69NGoLvSghkxOBq3Oga1GMuGwZIqhrdjzIVQM="
      GK_MASTER_KEY: "HANePj69NGoLvSghkxOBq3Oga1GMuGwZIqhrdjzIVQM="
    ports:
      - "8080:8080"
    depends_on:
      seaweedfs:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  seaweedfs_data:
